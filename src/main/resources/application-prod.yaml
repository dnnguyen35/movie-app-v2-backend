spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 4
      idle-timeout: 10000
      max-lifetime: 1800000
      connection-timeout: 5000
      connection-test-query: "SELECT 1"
      leak-detection-threshold: 3000
      pool-name: phimcuatoi-hikari-pool-

logging:
  level:
    root: INFO
    com.example.abcxyz: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{traceId}] [%X{ipAddress}] [%X{userId}] %logger{36} - %msg%n"