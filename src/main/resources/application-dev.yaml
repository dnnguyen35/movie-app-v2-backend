spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 4
      idle-timeout: 10000
      max-lifetime: 1800000
      connection-timeout: 5000
      connection-test-query: "SELECT 1"
      leak-detection-threshold: 3000
      pool-name: phimcuatoi-hikari-pool-

logging:
  file:
    name: logs/app.log

  logback:
    rollingpolicy:
      file-name-pattern: "logs/archived/app-%d{yyyy-MM-dd}.%i.log.gz"
      max-file-size: 10MB
      max-history: 10
      total-size-cap: 100MB

  level:
    root: INFO
    com.example.abcxyz: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG

  pattern:
    console: |
      %clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level) %clr([%X{traceId}]){yellow} %clr([%X{ipAddress}]){cyan} %clr([%X{userId}]){magenta} %clr(%logger{36}){blue} - %msg%n

    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{traceId}] [%X{ipAddress}] [%X{userId}] %logger{36} - %msg%n"